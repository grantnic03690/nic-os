name: nic-os
description: Ultra-lightweight bulletproof custom Fedora Atomic OS
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - labwc
      - waybar
      - swaybg
      - swaync
      - wofi
      - foot
      - thunar
      - greetd
      - tuigreet
      - wl-clipboard
      - grim
      - slurp
      - brightnessctl
      - network-manager-applet
      - pavucontrol
      - fontawesome-fonts-all
      - google-noto-sans-fonts

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: default-flatpaks
    notify: true
    system:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      repo-title: "Flathub (system-wide)"

  - type: signing
