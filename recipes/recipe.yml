name: nic-os
description: A lightweight, minimal, glassy Atomic OS based on Fedora.
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - labwc
      - waybar
      - swaync
      - swaybg
      - wofi
      - foot
      - thunar
      - greetd
      - tuigreet
      - fontawesome-fonts-all
      - google-noto-sans-fonts
      - network-manager-applet
      - blueman

  - type: systemd
    system:
      enabled:
        - greetd.service

  - type: script
    snippets:
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Nic OS"/' /usr/lib/os-release
      - sed -i 's/^NAME=.*/NAME="Nic OS"/' /usr/lib/os-release
